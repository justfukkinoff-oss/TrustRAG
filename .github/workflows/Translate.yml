name: English UI and Android Debug APK

on:
  workflow_dispatch:
  push:
    branches:
      - 'localization/**'

permissions:
  contents: read

concurrency:
  group: english-android-debug-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Check hardcoded English UI copy
        run: python3 scripts/check_english_ui.py

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          # Flutter 3.50 requires Gradle 9.3.1; Android still uses Gradle 8.14.
          flutter-version: '3.44.0'

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Set up Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r27c

      - name: Build bundled ARM64 backend
        working-directory: backend
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: cargo ndk -t arm64-v8a build --locked --release --no-default-features --features mobile

      - name: Stage bundled backend
        run: |
          install -Dm755 backend/target/aarch64-linux-android/release/trustrag-backend \
            apps/client/android/app/src/main/jniLibs/arm64-v8a/libtrustrap_backend.so

      - name: Test English localization
        working-directory: apps/client
        run: flutter test test/i18n_test.dart test/english_onboarding_test.dart test/chat_page_responsive_test.dart

      - name: Build debug APK
        working-directory: apps/client
        run: flutter build apk --debug --target-platform android-arm64

      - name: Verify bundled ARM64 backend in APK
        working-directory: apps/client
        run: unzip -l build/app/outputs/flutter-apk/app-debug.apk lib/arm64-v8a/libtrustrap_backend.so

      - uses: actions/upload-artifact@v4
        with:
          name: TrustRAG-English-debug-arm64
          path: apps/client/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
