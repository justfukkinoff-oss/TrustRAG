jobs: "on push"
name: "Google"
runs-on: "ubuntu-latest"
steps:
 - uses: "actions/checkout@v7"
 - uses: "fabasoad/translation-action@v4"
   id: "google-step"
   with:
          provider: "google"
          lang: "zh|en"
          source: "Kemenangan"
 - name: "Print the result"
    run: "echo Translation is '${{ steps.google-step.outputs.text }}'"
 
